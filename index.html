<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>WELDSABER - Galactic Pro SMAW</title>
    <!-- Cargamos A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <script>
      // BASE DE DATOS TÉCNICA (26 Preguntas)
      const DESAFIOS = [
        { q: "SMAW", a: "111", bad: "141" },
        { q: "E6013", a: "Rutilo", bad: "Básico" },
        { q: "Junta a tope", a: "G", bad: "F" },
        { q: "Junta en ángulo", a: "F", bad: "G" },
        { q: "E7016", a: "Básico", bad: "Rutilo" },
        { q: "Hidrógeno", a: "Grietas", bad: "Poros" },
        { q: "Acero", a: "< 1,7% C", bad: "1,7% C - 6,7% C" },
        { q: "Fundición", a: "1,7% C - 6,7% C", bad: "< 1,7% C" },
        { q: "Acero (Composición)", a: "Fe + C", bad: "Fe + O" },
        { q: "SMAW (Proceso)", a: "Manual", bad: "Automático" },
        { q: "SAN", a: "Atmósfera Natural", bad: "Atmósfera Protegida" },
        { q: "Polaridad Directa", a: "DC-", bad: "DC+" },
        { q: "Polaridad Inversa", a: "DC+", bad: "DC-" },
        { q: "Corriente Alterna", a: "AC (~)", bad: "DC (=)" },
        { q: "Zona afectada térmicamente", a: "ZAT", bad: "TAZ" },
        { q: "Electrones", a: "-", bad: "+" },
        { q: "Protones", a: "+", bad: "-" },
        { q: "Tensión (V)", a: "Voltio (V)", bad: "Ohmio (Ω)" },
        { q: "Intensidad (I)", a: "Amperio (A)", bad: "Voltio (V)" },
        { q: "Plasma", a: "Gas ionizado", bad: "Gas inerte" },
        { q: "Soplo magnético", a: "Desviación del arco", bad: "Porosidad" },
        { q: "Ánodo", a: "+", bad: "-" },
        { q: "Cátodo", a: "-", bad: "+" },
        { q: "Curva característica SMAW", a: "Descendente", bad: "Plana" },
        { q: "Curva característica SMAW", a: "Intensidad constante", bad: "Tensión constante" },
        { q: "Ley de Ohm", a: "V = R x I", bad: "V = R / I" }
      ];

      let score = 0;
      let combo = 0;
      let lives = 3;
      let questionsAnswered = 0;
      let gameActive = false;
      let currentChallenge = null;

      const BASE_DURATION = 8500; 
      const MIN_DURATION = 2800;  
      const SPEED_STEP = 250;     
      let currentDuration = BASE_DURATION;

      const FONT_ESTABLE = "dejavu";

      AFRAME.registerComponent('game-engine', {
        init: function () {
          this.pizarra = document.querySelector('#hint-text');
          this.scoreText = document.querySelector('#score-text');
          this.comboText = document.querySelector('#combo-text');
          this.livesText = document.querySelector('#lives-text');
          this.progressBar = document.querySelector('#progress-bar-fill');
          
          this.saberStart = new THREE.Vector3();
          this.saberEnd = new THREE.Vector3();
          this.targetPos = new THREE.Vector3();
          this.saberLine = new THREE.Line3();
          this.closestPoint = new THREE.Vector3();
          
          this.startTarget = null;
          this.isTransitioning = false; 

          this.createStartTarget();
        },

        // MOTOR DE COLISIONES BLINDADO ANTI-CUELGUES
        tick: function () {
            if (this.isTransitioning) return; 

            // Obtenemos los sables activos sin usar querySelectorAll por rendimiento
            const sabers = [
                document.getElementById('leftHand'),
                document.getElementById('rightHand'),
                document.getElementById('leftHandTrack'),
                document.getElementById('rightHandTrack')
            ].filter(el => el && el.object3D);

            if (sabers.length === 0) return;

            // 1. Choques con el botón de inicio
            if (!gameActive) {
                if (this.startTarget) {
                    const targetPosObj = this.startTarget.getAttribute('position');
                    if (!targetPosObj) return;
                    this.targetPos.set(targetPosObj.x, targetPosObj.y, targetPosObj.z);
                    
                    sabers.forEach(saber => {
                        if (gameActive) return;
                        
                        const base = saber.object3D;
                        const tipEl = saber.querySelector('.saber-tip');
                        if (!tipEl || !tipEl.object3D) return;

                        base.getWorldPosition(this.saberStart);
                        tipEl.object3D.getWorldPosition(this.saberEnd);

                        // Seguro anti-congelación (evita vectores vacíos)
                        if (isNaN(this.saberStart.x) || isNaN(this.saberEnd.x)) return;
                        if (this.saberStart.distanceTo(this.saberEnd) < 0.1) return; 

                        this.saberLine.set(this.saberStart, this.saberEnd);
                        this.saberLine.closestPointToPoint(this.targetPos, true, this.closestPoint);
                        
                        if (this.closestPoint.distanceTo(this.targetPos) < 0.38) {
                            this.startGame();
                        }
                    });
                }
                return;
            }

            // 2. Choques físicos reales con las preguntas
            const targets = document.querySelectorAll('.target-item');
            targets.forEach(target => {
                if (target.dataset.hit === "true") return;
                
                const targetPosObj = target.getAttribute('position');
                if (!targetPosObj) return;
                this.targetPos.set(targetPosObj.x, targetPosObj.y, targetPosObj.z);
                
                sabers.forEach(saber => {
                    if (target.dataset.hit === "true" || this.isTransitioning) return;

                    const base = saber.object3D;
                    const tipEl = saber.querySelector('.saber-tip');
                    if (!tipEl || !tipEl.object3D) return;

                    base.getWorldPosition(this.saberStart);
                    tipEl.object3D.getWorldPosition(this.saberEnd);

                    if (isNaN(this.saberStart.x) || isNaN(this.saberEnd.x)) return;
                    if (this.saberStart.distanceTo(this.saberEnd) < 0.1) return;

                    this.saberLine.set(this.saberStart, this.saberEnd);
                    this.saberLine.closestPointToPoint(this.targetPos, true, this.closestPoint);
                    
                    if (this.closestPoint.distanceTo(this.targetPos) < 0.38) { 
                        target.dataset.hit = "true";
                        this.handleHit(target, this.closestPoint.clone());
                    }
                });
            });
        },

        createStartTarget: function() {
            if (this.startTarget) return;
            const target = document.createElement('a-entity');
            target.setAttribute('class', 'start-target'); 
            target.setAttribute('position', '0 1.3 -1.5'); 
            
            target.setAttribute('animation', {
                property: 'position', to: '0 1.4 -1.5',
                dir: 'alternate', loop: true, dur: 2000, easing: 'easeInOutSine'
            });

            target.addEventListener('click', () => { if (!gameActive) this.startGame(); });
            
            const body = document.createElement('a-cylinder');
            body.setAttribute('rotation', '90 0 0');
            body.setAttribute('radius', '0.36');
            body.setAttribute('height', '0.032');
            body.setAttribute('material', 'color: #111111; metalness: 0.9; roughness: 0.1; emissive: #27ae60; emissiveIntensity: 0.3');
            
            const text = document.createElement('a-text');
            text.setAttribute('value', 'CORTAR\nINICIAR');
            text.setAttribute('align', 'center');
            text.setAttribute('width', '4');
            text.setAttribute('position', '0 0 0.025');
            text.setAttribute('color', '#2ecc71');
            text.setAttribute('font', FONT_ESTABLE);
            text.setAttribute('material', 'shader: flat; emissive: #2ecc71; emissiveIntensity: 0.6');

            target.appendChild(body);
            target.appendChild(text);
            this.el.appendChild(target);
            this.startTarget = target;
        },

        startGame: function() {
          if (gameActive) return;
          gameActive = true;
          this.isTransitioning = true; 
          
          if (this.startTarget) {
              const posObj = this.startTarget.getAttribute('position');
              this.sliceEffect(posObj);
              this.createSparks(posObj);
              if (this.startTarget.parentNode) this.startTarget.parentNode.removeChild(this.startTarget);
              this.startTarget = null;
          }

          score = 0;
          combo = 0;
          lives = 3;
          questionsAnswered = 0;
          currentDuration = BASE_DURATION;
          this.updateUI();
          this.setSaberColor('#f1c40f', 5);
          
          setTimeout(() => {
              this.isTransitioning = false;
              this.nextChallenge();
          }, 1000);
        },

        nextChallenge: function() {
          if (!gameActive) return;
          
          let next;
          do {
            next = DESAFIOS[Math.floor(Math.random() * DESAFIOS.length)];
          } while (next === currentChallenge && DESAFIOS.length > 1);
          
          currentChallenge = next;
          this.pizarra.setAttribute('value', currentChallenge.q);
          this.pizarra.setAttribute('color', '#2ecc71');
          this.spawnTargets();
        },

        spawnTargets: function() {
          const isCorrectLeft = Math.random() > 0.5;
          this.createTarget(currentChallenge.a, isCorrectLeft ? -1.04 : 1.04, true);
          this.createTarget(currentChallenge.bad, isCorrectLeft ? 1.04 : -1.04, false);
        },

        createTarget: function(label, xPos, isCorrect) {
          const target = document.createElement('a-entity');
          target.setAttribute('class', 'target-item'); 
          target.setAttribute('position', `${xPos} 1.3 -22`);
          target.dataset.correct = isCorrect;
          
          target.addEventListener('click', () => {
              if (gameActive && target.dataset.hit !== "true") {
                  target.dataset.hit = "true";
                  this.handleHit(target, null);
              }
          });
          
          const body = document.createElement('a-cylinder');
          body.setAttribute('rotation', '90 0 0');
          body.setAttribute('radius', '0.36'); 
          body.setAttribute('height', '0.032'); 
          body.setAttribute('material', 'color: #111111; metalness: 0.9; roughness: 0.1; emissive: #f1c40f; emissiveIntensity: 0.05');
          
          const text = document.createElement('a-text');
          text.setAttribute('value', label);
          text.setAttribute('align', 'center');
          text.setAttribute('width', '4.4'); 
          text.setAttribute('position', '0 0 0.025');
          text.setAttribute('color', '#f1c40f');
          text.setAttribute('font', FONT_ESTABLE);
          text.setAttribute('material', 'shader: flat; emissive: #f1c40f; emissiveIntensity: 0.6');

          target.appendChild(body);
          target.appendChild(text);

          target.setAttribute('animation', {
            property: 'position', to: `${xPos} 1.3 5`,
            dur: currentDuration, easing: 'linear'
          });

          this.el.appendChild(target);

          setTimeout(() => {
            if (target.parentNode && target.dataset.hit !== "true") {
              if (isCorrect && gameActive && !this.isTransitioning && this.pizarra.getAttribute('value') === currentChallenge.q) {
                this.handleMiss();
              }
              if (target.parentNode) target.parentNode.removeChild(target);
            }
          }, currentDuration + 100);
        },

        handleHit: function(targetEl, hitPoint) {
          if (this.isTransitioning) return; 
          this.isTransitioning = true;
          
          const isCorrect = targetEl.dataset.correct === "true";
          const pos = targetEl.getAttribute('position');
          
          this.createSparks(hitPoint || pos);

          if (isCorrect) {
            score += 10 + (combo * 2);
            combo++;
            questionsAnswered++;
            this.checkEvents();
            this.increaseSpeed();
            this.pizarra.setAttribute('value', '¡CORRECTO!');
            this.pizarra.setAttribute('color', '#2ecc71');
            this.sliceEffect(pos);
            
            this.cleanupTargets(); 
            
            if (questionsAnswered >= DESAFIOS.length) {
                this.victory();
            } else {
                setTimeout(() => {
                    this.isTransitioning = false;
                    this.nextChallenge();
                }, 800);
            }
          } else {
            lives--;
            combo = 0;
            this.checkEvents();
            targetEl.setAttribute('material', 'color: #c0392b');
            targetEl.setAttribute('animation__err', {property: 'scale', to: '0 0 0', dur: 200});
            this.pizarra.setAttribute('value', 'ERROR DE ANÁLISIS');
            this.pizarra.setAttribute('color', '#c0392b');
            
            if (lives <= 0) { 
                this.gameOver(); 
            } else { 
                this.cleanupTargets(targetEl); 
                setTimeout(() => {
                    if (targetEl.parentNode) targetEl.parentNode.removeChild(targetEl);
                    this.isTransitioning = false;
                    this.nextChallenge();
                }, 1500); 
            }
          }
          this.updateUI();
        },

        checkEvents: function() {
            if (questionsAnswered === 13) {
                this.setSaberColor('#ff00ff', 10);
                currentDuration = Math.max(MIN_DURATION, currentDuration - 1200);
                this.pizarra.setAttribute('value', '¡MODO OVERDRIVE!');
            } else if (combo >= 5 && questionsAnswered < 13) {
                this.setSaberColor('#00ffff', 8);
            } else if (combo < 5 && questionsAnswered < 13) {
                this.setSaberColor('#f1c40f', 5);
            }
        },

        handleMiss: function() {
            if (this.isTransitioning) return;
            this.isTransitioning = true;

            lives--;
            combo = 0;
            this.checkEvents();
            this.pizarra.setAttribute('value', '¡FUERA DE TIEMPO!');
            this.pizarra.setAttribute('color', '#c0392b');
            this.updateUI();

            if (lives <= 0) { 
                this.gameOver(); 
            } else { 
                this.cleanupTargets();
                setTimeout(() => {
                    this.isTransitioning = false;
                    this.nextChallenge();
                }, 1500); 
            }
        },

        victory: function() {
            gameActive = false;
            this.isTransitioning = false;
            this.cleanupTargets();
            this.pizarra.setAttribute('value', '¡MISIÓN CUMPLIDA - MAESTRO SMAW!');
            this.pizarra.setAttribute('color', '#2ecc71');
            setTimeout(() => this.createStartTarget(), 2000);
        },

        gameOver: function() {
            gameActive = false;
            this.isTransitioning = false;
            this.cleanupTargets();
            this.pizarra.setAttribute('value', 'FALLO CRÍTICO - SISTEMA COLAPSADO');
            this.pizarra.setAttribute('color', '#ff0000');
            setTimeout(() => {
                this.createStartTarget();
                this.pizarra.setAttribute('value', 'CORTA EL DISCO VERDE PARA REINTENTAR');
                this.pizarra.setAttribute('color', '#FFFFFF');
            }, 2000);
        },

        increaseSpeed: function() {
            currentDuration = Math.max(MIN_DURATION, currentDuration - SPEED_STEP);
        },

        setSaberColor: function(color, intensity) {
            this.saberBlades.forEach(blade => {
                blade.setAttribute('material', {color: color, emissive: color, emissiveIntensity: intensity});
                const light = blade.parentNode.querySelector('a-light');
                if (light) light.setAttribute('color', color);
            });
        },

        updateUI: function() {
            this.scoreText.setAttribute('value', `PUNTOS: ${score}`);
            this.comboText.setAttribute('value', `RACHA: ${combo}`);
            this.livesText.setAttribute('value', `VIDAS: ${lives} / 3`);
            this.livesText.setAttribute('color', lives === 1 ? '#ff0000' : '#FFFFFF');
            
            const progress = questionsAnswered / DESAFIOS.length;
            this.progressBar.setAttribute('width', progress * 5);
            this.progressBar.setAttribute('position', `${(progress * 5 / 2) - 2.5} 0 0.01`);
        },

        createSparks: function(pos) {
          if (!pos || pos.x === undefined) return;
          for(let i=0; i<15; i++) {
            const spark = document.createElement('a-sphere');
            spark.setAttribute('radius', '0.018');
            spark.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
            const color = combo >= 5 ? '#00ffff' : (questionsAnswered >= 13 ? '#ff00ff' : '#f1c40f');
            spark.setAttribute('material', `color: ${color}; shader: flat; emissive: ${color}; emissiveIntensity: 4`);
            const dest = {
              x: pos.x + (Math.random() - 0.5) * 3,
              y: pos.y + (Math.random() - 0.5) * 3,
              z: pos.z + (Math.random() - 0.5) * 1.5
            };
            spark.setAttribute('animation', { property: 'position', to: `${dest.x} ${dest.y} ${dest.z}`, dur: 550, easing: 'easeOutQuad' });
            spark.setAttribute('animation__fade', { property: 'scale', to: '0 0 0', dur: 550 });
            this.el.appendChild(spark);
            setTimeout(() => { if(spark.parentNode) spark.parentNode.removeChild(spark); }, 600);
          }
        },

        sliceEffect: function(pos) {
          if (!pos || pos.x === undefined) return;
          const createHalf = (side) => {
            const half = document.createElement('a-cylinder');
            half.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
            half.setAttribute('rotation', '90 0 0');
            half.setAttribute('radius', '0.36'); 
            half.setAttribute('height', '0.016');
            half.setAttribute('theta-length', '180');
            half.setAttribute('theta-start', side === 'left' ? '0' : '180');
            const color = questionsAnswered >= 13 ? '#ff00ff' : '#2ecc71';
            half.setAttribute('material', `color: #111111; emissive: ${color}; emissiveIntensity: 0.5`);
            half.setAttribute('animation', { property: 'position', to: `${pos.x + (side === 'left' ? -2.5 : 2.5)} ${pos.y - 2} ${pos.z + 1.5}`, dur: 1200, easing: 'easeInQuad' });
            half.setAttribute('animation__rot', { property: 'rotation', to: `${Math.random()*360} ${Math.random()*360} 0`, dur: 1200 });
            this.el.appendChild(half);
            setTimeout(() => { if(half.parentNode) half.parentNode.removeChild(half); }, 1250);
          };
          createHalf('left'); createHalf('right');
        },

        cleanupTargets: function(excludeEl = null) {
          document.querySelectorAll('.target-item').forEach(t => { 
              if (t !== excludeEl && t.parentNode) t.parentNode.removeChild(t); 
          });
        }
      });
    </script>
    <style>
      body { margin: 0; overflow: hidden; background-color: transparent; }
    </style>
  </head>
  <body>
    <a-scene 
      game-engine
      renderer="alpha: true; antialias: true; colorManagement: true; highRefreshRate: true"
      webxr="optionalFeatures: hit-test, local-floor, passthrough;">
      
      <a-sky visible="false"></a-sky>
      <a-light type="ambient" intensity="0.9"></a-light>
      <a-light type="directional" position="2 4 2" intensity="0.7"></a-light>

      <a-grid position="0 0 0" rotation="-90 0 0" width="30" height="60" material="color: #f1c40f; opacity: 0.08; transparent: true"></a-grid>

      <a-entity id="rig">
        <a-camera position="0 1.6 0">
            <a-entity cursor="rayOrigin: mouse" raycaster="objects: .start-target, .target-item"></a-entity>
        </a-camera>
        
        <!-- SABLES FISICOS (Puntos ocultos añadidos en la punta "saber-tip" para físicas precisas) -->
        <a-entity id="leftHand" class="saber-controller" laser-controls="hand: left">
            <a-cylinder class="saber-blade" position="0 0 -0.5" rotation="90 0 0" radius="0.012" height="1.0" material="color: #f1c40f; emissive: #f1c40f; emissiveIntensity: 6"></a-cylinder>
            <a-entity class="saber-tip" position="0 0 -1.0"></a-entity>
            <a-light type="point" color="#f1c40f" intensity="1.2" distance="3.2"></a-light>
        </a-entity>
        
        <a-entity id="rightHand" class="saber-controller" laser-controls="hand: right">
            <a-cylinder class="saber-blade" position="0 0 -0.5" rotation="90 0 0" radius="0.012" height="1.0" material="color: #f1c40f; emissive: #f1c40f; emissiveIntensity: 6"></a-cylinder>
            <a-entity class="saber-tip" position="0 0 -1.0"></a-entity>
            <a-light type="point" color="#f1c40f" intensity="1.2" distance="3.2"></a-light>
        </a-entity>

        <a-entity id="leftHandTrack" class="saber-controller" hand-tracking-controls="hand: left">
             <a-cylinder class="saber-blade" position="0 0 -0.28" rotation="90 0 0" radius="0.008" height="0.56" material="color: #f1c40f; emissive: #f1c40f; emissiveIntensity: 4"></a-cylinder>
             <a-entity class="saber-tip" position="0 0 -0.56"></a-entity>
        </a-entity>
        <a-entity id="rightHandTrack" class="saber-controller" hand-tracking-controls="hand: right">
             <a-cylinder class="saber-blade" position="0 0 -0.28" rotation="90 0 0" radius="0.008" height="0.56" material="color: #f1c40f; emissive: #f1c40f; emissiveIntensity: 4"></a-cylinder>
             <a-entity class="saber-tip" position="0 0 -0.56"></a-entity>
        </a-entity>
      </a-entity>

      <!-- TERMINAL DE CONTROL (HUD A -5.0 METROS) -->
      <a-entity position="0 2.2 -5.0" scale="0.8 0.8 0.8">
        <a-plane color="#000000" width="6.5" height="2.8" opacity="0.95" material="metalness: 0.5"></a-plane>
        <a-ring color="#f1c40f" radius-inner="3.3" radius-outer="3.4" position="0 0 -0.01" opacity="0.1"></a-ring>
        
        <a-text value="WELDSABER :: SMAW EDITION" align="center" position="0 1.1 0.05" width="5.5" color="#f1c40f" font="dejavu"></a-text>
        
        <a-entity position="0 0.85 0.06">
            <a-plane color="#333" width="5" height="0.1" position="0 0 0"></a-plane>
            <a-plane id="progress-bar-fill" color="#2ecc71" width="0" height="0.1" position="-2.5 0 0.01" material="emissive: #2ecc71; emissiveIntensity: 0.5"></a-plane>
        </a-entity>
        
        <a-text id="hint-text" value="SISTEMA LISTO PARA INICIAR" align="center" position="0 0.35 0.05" width="7" color="#2ecc71" font="dejavu"></a-text>
        
        <a-text id="lives-text" value="VIDAS: 3 / 3" align="center" position="0 -0.25 0.05" width="5.5" font="dejavu"></a-text>
        
        <a-text id="score-text" value="PUNTOS: 0" align="center" position="-1.8 -0.8 0.05" width="4.5" color="#f1c40f" font="dejavu"></a-text>
        <a-text id="combo-text" value="RACHA: 0" align="center" position="1.8 -0.8 0.05" width="4.5" color="#f1c40f" font="dejavu"></a-text>
      </a-entity>

    </a-scene>
  </body>
</html>
